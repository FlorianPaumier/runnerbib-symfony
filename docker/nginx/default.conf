map $request_uri $runnerbib_log_path {
    default $uri;
    ~^/newsletter/desinscription/ /newsletter/desinscription/[redacted];
    ~^/verification/ /verification/[redacted];
    ~^/reinitialiser/ /reinitialiser/[redacted];
}

log_format runnerbib_safe '$remote_addr [$time_local] "$request_method $runnerbib_log_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log runnerbib_safe;
    root /app/public;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_PROXY "";
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
