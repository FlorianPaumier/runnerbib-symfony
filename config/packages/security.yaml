security:
    password_hashers:
        App\Infrastructure\Identity\SecurityUser:
            algorithm: argon2id
    providers:
        identities:
            id: App\Infrastructure\Identity\IdentityUserProvider
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identities
            form_login:
                login_path: identity_login
                check_path: identity_login
                enable_csrf: true
                default_target_path: /
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: identity_logout
                target: /
                enable_csrf: true
                invalidate_session: true
    access_control:
        - { path: ^/admin/finance, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/compte, roles: ROLE_USER }
framework:
    csrf_protection: true
    rate_limiter:
        newsletter_request:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        identity_request:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
when@test:
    security:
        password_hashers:
            App\Infrastructure\Identity\SecurityUser:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
