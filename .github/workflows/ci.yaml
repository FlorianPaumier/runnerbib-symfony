name: Symfony checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start development stack
        run: make up
      - name: Verify behavior and architecture
        run: |
          make quality
          docker compose exec php composer validate --strict
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/ready
      - name: Export coverage report
        if: always()
        run: docker compose cp php:/app/var/coverage ./coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
      - name: Export mutation report
        if: always()
        run: docker compose cp php:/app/var/infection ./mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: mutation/
          if-no-files-found: warn
      - name: Validate production build
        env:
          APP_SECRET: ci-validation-only
          POSTGRES_PASSWORD: ci-validation-only
          MAILER_DSN: null://null
        run: |
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml build
          docker compose -f compose.prod.yaml run --rm --no-deps php sh -c 'php bin/console cache:clear --env=prod --no-debug && php bin/console list doctrine:migrations --env=prod'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
